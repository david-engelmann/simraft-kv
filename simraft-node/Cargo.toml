[package]
name = "simraft-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Real I/O adapter for simraft-kv: runs one core node as a process with TCP transport and file storage"
keywords = ["raft", "consensus", "key-value", "server"]
categories = ["database-implementations", "network-programming"]

[dependencies]
simraft-core = { path = "../simraft-core" }
simraft-kv = { path = "../simraft-kv" }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
