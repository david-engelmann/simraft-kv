)</text><line x1="36.0" y1="368.0" x2="944.0" y2="368.0" stroke="#233c42" stroke-width="1.0" stroke-dasharray="3,3"/><rect x="304.2" y="358.5" width="371.7" height="19.0" rx="9.5" fill="#192e33" stroke="#365c65" stroke-width="1.1"/><text x="490.0" y="371.1" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.0" font-weight="700" text-anchor="middle">CLOCK-FREE LINEARIZABLE READ (R-01..R-04 · ZERO LOG WRITES)</text><path d="M94.0,408.0 L282.0,408.0" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#raft-seq-dark-arr-cyan)"/><text x="188.0" y="402.0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.9" font-weight="700" text-anchor="middle">ReadIndex(req=9, &quot;epoch&quot;)</text><rect x="284.0" y="396.0" width="176.0" height="36.0" rx="6" fill="#0e2436" stroke="#0284c7" stroke-width="1.1"/><text x="372.0" y="412.0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.3" font-weight="700" text-anchor="middle">Pins read_index = 12</text><text x="372.0" y="426.0" fill="#f1f5f9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.7" font-weight="500" text-anchor="middle">Starts heartbeat round = 4</text><path d="M378.0,446.0 L640.0,456.0" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#raft-seq-dark-arr-cyan)"/><text x="509.0" y="442.0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.9" font-weight="500" text-anchor="middle">Heartbeat(read_round = 4)</text><path d="M640.0,478.0 L462.0,488.0" fill="none" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#raft-seq-dark-arr-accent)"/><text x="551.0" y="474.0" fill="#2dd4bf" font-fa