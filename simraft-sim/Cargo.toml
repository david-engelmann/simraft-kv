[package]
name = "simraft-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/simraft-sim"
readme = "README.md"
description = "Deterministic simulation harness for simraft-kv with virtual time, seeded chaos faults, safety oracles, and linearizability checking"
keywords = ["raft", "simulation", "deterministic", "fault-injection", "testing"]
categories = ["algorithms", "development-tools::testing"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
simraft-core = { version = "0.1.0", path = "../simraft-core" }
simraft-kv = { version = "0.1.0", path = "../simraft-kv" }
simraft-wire = { version = "0.1.0", path = "../simraft-wire" }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "readindex_cost"
harness = false

[[bench]]
name = "checker_scale"
harness = false

[lints]
workspace = true
