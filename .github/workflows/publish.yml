name: publish-package

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to package"
        required: true
        type: choice
        options:
          - simraft-core
          - simraft-wire
          - simraft-kv
          - simraft-node
          - simraft-sim

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  package:
    name: package ${{ inputs.crate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-publish-package-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Package crate
        run: cargo package -p ${{ inputs.crate }} --locked
      - name: Upload the packaged crate
        uses: actions/upload-artifact@v4
        with:
          name: crate-${{ inputs.crate }}
          path: target/package/${{ inputs.crate }}-*.crate
          if-no-files-found: error
