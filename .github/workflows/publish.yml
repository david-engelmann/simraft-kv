name: publish-package

# Automated crates.io deployment via GitHub Actions.
# Supports crates.io OIDC Trusted Publishing (rust-lang/crates-io-auth-action)
# across simraft-core, simraft-wire, simraft-kv, simraft-node, and simraft-sim
# with automatic fallback to secrets.CARGO_REGISTRY_TOKEN for initial crate
# registration of first-time crate names.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (publish to crates.io or package-only dry run)"
        required: true
        type: choice
        default: "publish"
        options:
          - publish
          - package-only

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  package:
    name: verify and package crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-publish-package-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Verify crate and Python package version parity
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, tomllib
          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          for manifest in [
              "simraft-core/Cargo.toml",
              "simraft-wire/Cargo.toml",
              "simraft-kv/Cargo.toml",
              "simraft-node/Cargo.toml",
              "simraft-sim/Cargo.toml",
          ]:
              data = tomllib.loads(pathlib.Path(manifest).read_text(encoding="utf-8"))
              ver = data["package"]["version"]
              if ver != expected:
                  sys.exit(f"{manifest} version {ver!r} != {expected!r}")
              for dep_name, dep_spec in data.get("dependencies", {}).items():
                  if dep_name.startswith("simraft-") and isinstance(dep_spec, dict):
                      if dep_spec.get("version") != expected:
                          sys.exit(f"{manifest} dep {dep_name} version {dep_spec.get('version')!r} != {expected!r}")
          if os.environ.get("REF_TYPE") == "tag":
              tag_ver = os.environ["REF_NAME"].removeprefix("v")
              if tag_ver != expected:
                  sys.exit(f"tag {os.environ['REF_NAME']!r} != {expected!r}")
          print(f"verified version {expected}")
          PY
      - name: Package simraft-core and verify downstream package lists
        run: |
          cargo package -p simraft-core --locked
          cargo package --list -p simraft-wire --locked
          cargo package --list -p simraft-kv --locked
          cargo package --list -p simraft-node --locked
          cargo package --list -p simraft-sim --locked
      - name: Upload packaged simraft-core crate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-simraft-core
          path: target/package/simraft-core-*.crate
          if-no-files-found: error

  publish:
    name: publish to crates.io
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-publish-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Check secret token presence
        id: check_secret
        env:
          SECRET_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$SECRET_TOKEN" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io via OIDC Trusted Publishing
        if: steps.check_secret.outputs.has_secret != 'true'
        id: oidc_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish workspace crates in topological order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.check_secret.outputs.has_secret == 'true' && secrets.CARGO_REGISTRY_TOKEN || steps.oidc_auth.outputs.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys, time, tomllib, urllib.error, urllib.request

          version = tomllib.loads(pathlib.Path("simraft-core/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          crates = ["simraft-core", "simraft-wire", "simraft-kv", "simraft-node", "simraft-sim"]

          def sparse_url(name: str) -> str:
              low = name.lower()
              return f"https://index.crates.io/{low[:2]}/{low[2:4]}/{low}"

          def is_published(name: str, ver: str) -> bool:
              req = urllib.request.Request(
                  sparse_url(name),
                  headers={"User-Agent": "simraft-kv-release-ci/1.0", "Cache-Control": "no-cache"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      for line in resp.read().decode("utf-8").splitlines():
                          if line.strip() and json.loads(line).get("vers") == ver:
                              return True
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return False
                  raise
              return False

          for idx, crate in enumerate(crates):
              if is_published(crate, version):
                  print(f"{crate}@{version} is already published on crates.io; skipping")
                  continue
              print(f"publishing {crate}@{version} to crates.io...")
              subprocess.run(["cargo", "publish", "-p", crate, "--locked"], check=True)
              if idx + 1 < len(crates):
                  deadline = time.monotonic() + 180.0
                  while time.monotonic() < deadline:
                      if is_published(crate, version):
                          print(f"{crate}@{version} is visible in the crates.io sparse index")
                          break
                      time.sleep(5)
                  else:
                      sys.exit(f"timed out waiting for {crate}@{version} in crates.io sparse index")
          PY
