name: Weekly seed sweep (100,000 seeds)

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sweep:
    name: Seeds from ${{ matrix.base }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        base: [0, 10000, 20000, 30000, 40000, 50000, 60000, 70000, 80000, 90000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-weekly-sweep-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Run 10,000 chaos seeds
        run: |
          cargo build -p simraft-sim --release --locked
          step=100
          end=$(( ${{ matrix.base }} + 10000 ))
          for (( base=${{ matrix.base }}; base<end; base+=step )); do
            SIM_SEED=$base ./target/release/simraft-sim \
              --seed "$base" --seeds "$step" --chaos --json > "sweep-$base.json"
            head -1 "sweep-$base.json"
          done

  scenario-sweep:
    name: Adversarial fault scenarios, wide seed batches
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-scenario-sweep-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Run the scenario seed sweep wide
        run: SIM_SWEEP_WIDE=1 cargo test --release --locked -p simraft-sim --test scenario_seed_sweep
