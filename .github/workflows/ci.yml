name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  docs-and-determinism-guards:
    name: Docs and determinism guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: No em dashes or en dashes in public copy
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.md'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              for i, line in enumerate(text.splitlines(), 1):
                  if '\u2014' in line or '\u2013' in line:
                      bad.append(f"{p}:{i}")
          if bad:
              print("em dash or en dash found in public copy:")
              print("\n".join(bad))
              sys.exit(1)
          print("no em dashes or en dashes in markdown")
          PY
      - name: Architectural decision and invariant docs present
        run: |
          test -f DECISIONS.md
          test -f docs/ARCHITECTURE.md
          test -f docs/INVARIANTS.md
          grep -q "^# Architectural Decisions" DECISIONS.md
      - name: Forbidden nondeterminism identifiers in deterministic crates
        run: |
          rc=0
          hits=$(grep -rnE "\b(HashMap|HashSet|SystemTime|thread_rng|OsRng)\b|Instant::now" \
            --include='*.rs' simraft-core simraft-kv simraft-wire simraft-sim) || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "determinism guard grep failed with status $rc"
            exit 1
          fi
          hits=$(printf '%s' "$hits" | grep -vE ":[[:space:]]*//" || true)
          if [ -n "$hits" ]; then
            echo "forbidden nondeterminism identifiers found:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "no forbidden nondeterminism identifiers"
      - name: ShellCheck shell scripts
        run: shellcheck install.sh book/sync-docs.sh examples/cluster_quickstart.sh

  rust-gates-matrix:
    name: Rust gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-gates-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo doc --workspace --no-deps --locked
          cargo test --workspace --all-features --locked
          cargo bench --workspace --locked -- --test
          cargo run -p simraft-core --example embed --locked
      - name: Check fuzz targets on stable Rust
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo check --manifest-path fuzz/Cargo.toml --locked --bins
      - name: Build simulator and node CLIs and run Python SDK tests
        shell: bash
        run: |
          cargo build --locked -p simraft-sim --bin simraft-sim
          cargo build --locked -p simraft-node --bin simraft-node
          python3 -m unittest discover -s python/tests -v || python -m unittest discover -s python/tests -v
      - name: Run top-level examples
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python examples/chaos_sweep_and_replay.py
            sh examples/cluster_quickstart.sh --sim-only
          else
            python3 examples/chaos_sweep_and_replay.py
            sh examples/cluster_quickstart.sh --live-tcp
          fi

  macos-gates:
    name: Rust gates (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-gates-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo doc --workspace --no-deps --locked
          cargo test --workspace --all-features --locked
          cargo bench --workspace --locked -- --test
          cargo run -p simraft-core --example embed --locked
      - name: Build simulator and node CLIs and run Python SDK tests
        shell: bash
        run: |
          cargo build --locked -p simraft-sim --bin simraft-sim
          cargo build --locked -p simraft-node --bin simraft-node
          python3 -m unittest discover -s python/tests -v || python -m unittest discover -s python/tests -v
      - name: Run top-level examples
        shell: bash
        run: |
          python3 examples/chaos_sweep_and_replay.py
          sh examples/cluster_quickstart.sh --live-tcp

  deny:
    name: Supply-chain audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: Run cargo-deny check
        run: cargo deny check

  rust-gates:
    name: Rust gates (fmt, clippy, doc, test, bench smoke)
    needs: [rust-gates-matrix, msrv, deny]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all OS, MSRV, and supply-chain gates green
        run: |
          test "${{ needs.rust-gates-matrix.result }}" = "success"
          test "${{ needs.msrv.result }}" = "success"
          test "${{ needs.deny.result }}" = "success"

  msrv:
    name: MSRV 1.88 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install MSRV toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.88.0"
      - name: Cache MSRV build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-msrv-1.88.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Check workspace at MSRV 1.88
        run: cargo check --workspace --all-targets --all-features --locked

  seed-sweep:
    name: Seed sweep (simulator and property volume)
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '1000' || '10000' }}
      SEED_COUNT: ${{ github.event_name == 'pull_request' && '1000' || '10000' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.100.0"
      - name: Cache sweep build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-seed-sweep-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Run property volume and chaos seed sweep
        run: |
          cargo test --workspace --all-features --locked
          cargo build -p simraft-sim --release --locked
          step=100
          for (( base=0; base<SEED_COUNT; base+=step )); do
            SIM_SEED=$base ./target/release/simraft-sim \
              --seed "$base" --seeds "$step" --chaos --json > "sweep-$base.json"
            head -1 "sweep-$base.json"
          done
