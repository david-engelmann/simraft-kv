[workspace]
resolver = "2"
members = ["simraft-core", "simraft-kv", "simraft-sim"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/david-engelmann/simraft-kv"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
