[package]
name = "simraft-core"
version = "0.2.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/simraft-core"
readme = "README.md"
description = "Sans-I/O Raft consensus core with Pre-Vote, fast log backup, ReadIndex, snapshots, and single-server membership"
keywords = ["raft", "consensus", "replication", "sans-io", "deterministic"]
categories = ["algorithms"]

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "replication"
harness = false

[[bench]]
name = "step_allocations"
harness = false
